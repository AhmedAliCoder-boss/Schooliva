<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f5b4e">
    <title>Offline | Schooliva</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f5f7fa; color: #172b3a; }
      body { align-items: center; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: #fff; border: 1px solid #e1e8ed; border-radius: 18px; box-shadow: 0 16px 48px rgba(23, 43, 58, .08); max-width: 480px; padding: 32px; }
      .mark { align-items: center; background: #1f5b4e; border-radius: 12px; color: #fff; display: inline-flex; font-size: 22px; font-weight: 800; height: 44px; justify-content: center; width: 44px; }
      h1 { font-size: 1.6rem; margin: 22px 0 10px; }
      p { color: #536575; line-height: 1.65; margin: 0; }
      a { color: #176451; display: inline-block; font-weight: 700; margin-top: 22px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">S</span>
      <h1>You are offline</h1>
      <p>This page has not been saved for offline viewing. Reconnect and open it once to make its latest view available offline. Changes cannot be saved while offline.</p>
      <a href="/dashboard">Return to the dashboard</a>
    </main>
  </body>
</html>
